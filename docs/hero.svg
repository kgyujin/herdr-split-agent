<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Illustration: pick Right on an agent in the list, and it appears next to the current pane">
  <style>
    text { font-family: -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; fill: #d7dde5; }
    .dim { fill: #8b96a3; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="820" height="300" rx="14" fill="#161a20"/>
  <!-- popup -->
  <rect x="24" y="24" width="350" height="252" rx="12" fill="#232932" stroke="#323a45"/>
  <text x="42" y="52" font-size="11.5" class="dim">Show an agent next to this pane (no restart)</text>
  <text x="42" y="78" font-size="11" class="dim">Agents</text>
  <g font-size="13">
    <circle cx="48" cy="104" r="4" fill="#cfb07a"/><text x="64" y="108">api</text><text x="64" y="123" font-size="10.5" class="dim">demo · Working</text>
    <text x="318" y="110" font-size="11" class="dim">This tab</text>
    <circle cx="48" cy="152" r="4" fill="#8d98a5"/><text x="64" y="156">docs</text><text x="64" y="171" font-size="10.5" class="dim">demo · Idle</text>
    <rect x="214" y="138" width="70" height="26" rx="6" fill="#4a7fb0" stroke="#7fb0e0"/><text x="226" y="155" font-size="11.5">→ Right</text>
    <rect x="292" y="138" width="70" height="26" rx="6" fill="#2d343e"/><text x="304" y="155" font-size="11.5">↓ Below</text>
    <circle cx="48" cy="204" r="4" fill="#d9877f"/><text x="64" y="208">review</text><text x="64" y="223" font-size="10.5" class="dim">demo · Needs you</text>
    <rect x="214" y="190" width="70" height="26" rx="6" fill="#2d343e"/><text x="226" y="207" font-size="11.5">→ Right</text>
    <rect x="292" y="190" width="70" height="26" rx="6" fill="#2d343e"/><text x="304" y="207" font-size="11.5">↓ Below</text>
  </g>
  <!-- arrow -->
  <path d="M392 150 H436" stroke="#8b96a3" stroke-width="2" fill="none"/>
  <path d="M430 143 L440 150 L430 157" stroke="#8b96a3" stroke-width="2" fill="none"/>
  <!-- window with two panes -->
  <rect x="452" y="24" width="344" height="252" rx="12" fill="#232932" stroke="#323a45"/>
  <rect x="464" y="36" width="158" height="228" rx="8" fill="#161a20" stroke="#4a7fb0"/>
  <text x="476" y="56" font-size="11" class="dim">api</text>
  <g class="mono" font-size="10.5"><text x="476" y="82">● Reading session.ts</text><text x="476" y="100">● 24 tests passed</text></g>
  <rect x="630" y="36" width="154" height="228" rx="8" fill="#161a20" stroke="#323a45"/>
  <text x="642" y="56" font-size="11" class="dim">docs · attached</text>
  <g class="mono" font-size="10.5"><text x="642" y="82">● Drafting the guide</text><text x="642" y="100">● Linking API pages</text></g>
  <text x="624" y="292" font-size="10.5" class="dim" text-anchor="middle">same process, same history</text>
</svg>
